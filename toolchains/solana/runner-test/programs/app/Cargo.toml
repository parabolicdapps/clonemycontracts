[package]
name = "app"
version = "0.1.0"
description = "cmc-runner test program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "app"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.2", features = ["init-if-needed"] }
anchor-spl = "=1.2.2"
