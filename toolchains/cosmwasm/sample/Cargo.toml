[package]
name = "app"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
overflow-checks = true

[dependencies]
cosmwasm-std = "=2.2.2"
cosmwasm-schema = "=2.2.2"
cw-storage-plus = "=2.0.0"
cw2 = "=2.0.0"
cw20 = "=2.0.0"
cw-utils = "=2.0.0"
cw721 = "=0.20.0"
serde = { version = "1", default-features = false, features = ["derive"] }
schemars = "0.8"
thiserror = "1"
