[package]
name = "cmc-cosmwasm-runner"
version = "0.1.0"
edition = "2021"
publish = false

# `app` is the project under test. The entry copies the project to ./app (its package name must be `app`,
# with the modules `contract` and `error`) before building. The image pre-warms this build against ../runner-warm-app.
[dependencies]
app = { path = "app" }
cosmwasm-std = "=2.2.2"
cw-multi-test = "=2.5.1"
cw20-base = { version = "=2.0.0", features = ["library"] }
cw721-base = { version = "=0.20.0", features = ["library"] }
serde_json = "=1.0.154"
anyhow = "=1.0.105"

[profile.release]
opt-level = 1
debug = 0
codegen-units = 16
lto = false
incremental = false
# the wasm build of a contract is compiled with overflow checks; keep the native behaviour identical
overflow-checks = true
# panics in contract code are caught per step (catch_unwind), so keep unwinding
panic = "unwind"
