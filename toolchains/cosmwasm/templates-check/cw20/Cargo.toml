[package]
name = "app"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
overflow-checks = true

[dependencies]
cosmwasm-std = "=2.2.2"
cw20-base = { version = "=2.0.0", default-features = false, features = ["library"] }
