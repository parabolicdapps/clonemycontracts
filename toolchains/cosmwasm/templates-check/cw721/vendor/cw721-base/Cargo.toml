[package]
name = "cw721-base"
version = "0.20.0"
edition = "2021"
rust-version = "1.81"
description = "cw721-base 0.20.0 sources vendored verbatim (Apache-2.0, CosmWasm/cw-nfts) with crate-type rlib only"

[lib]
crate-type = ["rlib"]

[features]
library = []

[dependencies]
cosmwasm-schema = "^2.2"
cosmwasm-std = "^2.2"
cw-ownable = "^2.1"
cw2 = "^2.0"
cw721 = { path = "../cw721" }
serde = { version = "1.0", default-features = false, features = ["derive"] }
