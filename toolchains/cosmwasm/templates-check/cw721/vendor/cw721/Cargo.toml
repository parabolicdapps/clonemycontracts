[package]
name = "cw721"
version = "0.20.0"
edition = "2021"
rust-version = "1.81"
description = "cw721 0.20.0 sources vendored (Apache-2.0, CosmWasm/cw-nfts): rlib only, legacy cw721 0.16 dependency replaced by a local struct so a single cosmwasm-std is linked"

[lib]
crate-type = ["rlib"]

[dependencies]
cosmwasm-schema = "^2.2"
cosmwasm-std = "^2.2"
cw-ownable = "^2.1"
cw-storage-plus = "^2.0"
cw-utils = "^2.0"
cw2 = "^2.0"
schemars = "^0.8"
serde = { version = "^1.0", features = ["derive"], default-features = false }
thiserror = "^1.0"
url = "^2.5"
